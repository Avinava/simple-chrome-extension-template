<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Simple Chrome Extension Template</title>
  <desc id="description">A Manifest V3 starter for TypeScript, Preact, Vite, and Zustand.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="32" fill="url(#background)"/>
  <circle cx="1080" cy="-30" r="260" fill="#2563eb" opacity=".16"/>
  <circle cx="930" cy="330" r="220" fill="#7c3aed" opacity=".14"/>
  <g transform="translate(92 88)" filter="url(#shadow)">
    <rect width="160" height="160" rx="36" fill="#0b1224" stroke="url(#accent)" stroke-width="5"/>
    <rect x="22" y="30" width="116" height="84" rx="12" fill="#1e3a8a"/>
    <path d="M48 61l23 18-23 18M85 98h28" fill="none" stroke="#dbeafe" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M50 132h60" stroke="url(#accent)" stroke-width="12" stroke-linecap="round"/>
  </g>
  <g transform="translate(305 135)">
    <text fill="#f8fafc" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="56" font-weight="800" letter-spacing="-1.5">Simple Chrome</text>
    <text y="65" fill="url(#accent)" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="56" font-weight="800" letter-spacing="-1.5">Extension Template</text>
    <text y="116" fill="#bfdbfe" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">Manifest V3 · TypeScript · Preact · Vite · Zustand</text>
  </g>
</svg>
