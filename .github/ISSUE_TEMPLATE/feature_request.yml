name: Feature request
description: Suggest an improvement that benefits template users.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: Problem to solve
      description: What developer need or limitation does this address?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed change
      description: Describe the smallest useful improvement.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives considered
      description: Include workarounds or other approaches when known.
